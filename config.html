<!DOCTYPE html>
<html>
	<head> <meta charset="utf-8">
		<title>Smart room</title>
		<link rel="stylesheet" type="text/css" href="estilos.css">

        <script language="javascript">
            document.addEventListener('DOMContentLoaded', () => 
            {
                const inputMin = document.getElementById('tmin'); //identifica los elementos por su id y se guardan como ctes
                const inputMax = document.getElementById('tmax');
                const outputDif = document.getElementById('difTemp');

                function calcula() 
                {
                    const min = parseFloat(inputMin.value);
                    const max = parseFloat(inputMax.value);

                    const isMinValid = inputMin.checkValidity(); //para ver si los valores introducidos cumplen las restricciones html
                    const isMaxValid = inputMax.checkValidity();

                    if (isNaN(min) || isNaN(max) || !isMinValid || !isMaxValid) {
                    outputDif.textContent = 'Error. Los valores deben estar comprendidos entre -20º y 45º';
                    return;
                    }

                    const dif = max - min;
                    outputDif.textContent = `${dif} °C`;
                }

            
                inputMin.addEventListener('input', calcula);
                inputMax.addEventListener('input', calcula);
            });
        </script>
	</head>
	<body>

	
	  <header>
		<div class="header" >
			<h1>Smart room</h1>
		</div>
	  </header>
	  
	
	  <!-- CONTENIDO ÚNICO Y PRINCIPAL DE ESTA PÁGINA -->
       <script src="datos.js"></script>
	  <form action="" method="get">
	  <div class="contenido_principal">
		<div class = "datos">
            <div>
                <label for="paises">País:</label>
                <input list="paises" name="pais" id="pais" required>
                <datalist id="paises">
                    <option value="España">
                    <option value="Italia">
                    <option value="Polonia">
                    <option value="Portugal">
                    <option value="China">
                </datalist>  
            </div>
            <div>
                <label for="ciudades">Ciudad:</label>
                <input name="ciudad" type="text" required>  
            </div>
            <div>
                <label for="localizacion">Coordenadas GPS:</label>
                <input name="localizacion" type="url" required>   
            </div>
            <div>
                <label for="foto-habitacion">Fotografía de la habitación:</label>
                <input type="file" id="foto-habitacion" name="foto_habitacion" accept="image/*" required >
            </div>
            <div>
                <label for="contraseña">Contraseña:</label>
                <input name="contraseña" type="password" required>
            </div>
            
		</div>

		<div class = "datos">
            
			<h3> Datos de los sensores</h3>
            

			<p>Contenido específico de los sensores</p>
            <label for="temp">Temperatura</label>
                <input type="checkbox" name="sensores" value="Temperatura">
            <br>

            <label for="humedad">Humedad</label>
                <input type="checkbox" name="sensores" value="Humedad">    
            <br>

            <label for="sonido">Nivel de sonido</label>
                <input type="checkbox" name="sensores" value="Nivel de sonido">
            <br>

            <label for="mov">Movimiento</label>
                <input type="checkbox" name="sensores" value="Movimiento">
            <br>
            <label for="tmax">Temperatura máxima: </label>
                <input type="number" id="tmax" name="tmax"
                        min="-20" max="45" step="0.5" required>
            <br>
            <label for="tmin">Temperatura mínima: </label>
                <input type="number" id="tmin" name="tmin"
                        min="-20" max="45" step="0.5"  required>
            <br>

            <label for="difTemp">Diferencia de temperatura:</label>
                <output id="difTemp" name="difTemp" for="tmax tmin">
        
		</div>
	  </div>
      <div class="contenido_principal">
        <div class="boton">
            <button type="submit" class="btn">Enviar</button>
        </div>
      </div>

    </form>

	  
	  <footer class="footer">
		<a href="index.html">Inicio</a>
	  </footer>

	</body>
</html>
