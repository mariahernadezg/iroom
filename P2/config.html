<!DOCTYPE html>
<html lang="es">
	<head> <meta charset="utf-8">
		<title>Configuración</title>
		<link rel="stylesheet" type="text/css" href="./css/iroom.css">
        <script src="formulario.js" defer></script>


        <script>
            document.addEventListener ('DOMContentLoaded', () => 
            {
                const inputMin = document.getElementById('tmin'); //identifica los elementos por su id y se guardan como ctes
                const inputMax = document.getElementById('tmax');
                const outputDif = document.getElementById('difTemp');

                function calcula() 
                {
                    const min = parseFloat(inputMin.value);
                    const max = parseFloat(inputMax.value);

                    const isMinValid = inputMin.checkValidity(); //para ver si los valores introducidos cumplen las restricciones html
                    const isMaxValid = inputMax.checkValidity();

                    if (isNaN(min) || isNaN(max) || !isMinValid || !isMaxValid) {
                    outputDif.textContent = 'Error. Los valores deben estar comprendidos entre -20º y 45º';
                    return;
                    }

                    const dif = max - min;
                    outputDif.textContent = `${dif} °C`;
                }

            
                inputMin.addEventListener('input', calcula);
                inputMax.addEventListener('input', calcula);
            });
            
        </script>
	</head>
	<body>

	
	  <header>
		<div class="header" >
			<h1>Configuración</h1>
		</div>
	  </header>

	  <!-- Navegación-->
       <nav class="navegacion">
            <div class="menu">
                <a href="index.html">Inicio</a>
            </div>
            <div class="menu" >
               	<a href="config.html">Configuración</a>
            </div>
            <div class="menu">
               	<a href="minombre.html">Registro</a>
            </div>
			<div class="menu">
               	<a href="calculadora.html">Calculadora</a>
            </div>
            <aside class="menu" >
               	<p id="mensaje">Hola: Bienvenido a Smart Room</p>
            </aside>
        </nav>
	
	  <!-- CONTENIDO ÚNICO Y PRINCIPAL DE ESTA PÁGINA -->
       
	  <form id= "formulario" action="" method="get">
	  <div class="contenido_principal">
		<div class = "datos">
            <div>
                <label for="pais">País:</label>
                <input list="paises" name="pais" id="pais">
                <datalist id="paises">
                    <option value="España">
                    <option value="Italia">
                    <option value="Polonia">
                    <option value="Portugal">
                    <option value="China">
                </datalist>  
            </div>
            <div>
                <label for="ciudad">Ciudad:</label>
                <input id="ciudad" name="ciudad" type="text" placeholder = "Alcalá de Henares">  
            </div>
            <div>
                <label for="localizacion">Coordenadas GPS:</label>
                <input id = "localizacion" name="localizacion" type="text" placeholder = "N 40º 30' 45.00&quot, O 3º 20' 54.00&quot">
                <br>
                <p>Generación de coordenadas:  </p>
                <p id="coordenadasGPS"></p>   
            </div>
            <div>
                <label for="foto-habitacion">Fotografía de la habitación:</label>
                <input  id="foto-habitacion" name="foto_habitacion" type="file" accept="image/*">
                <br>
                <p id="coordenadasGPS"></p>
            </div>
            <div>
                <label for="contraseña">Contraseña:</label>
                <input id="contraseña" name="contraseña" type="password">
                <p id="seguridad" class="seguridad"></p>
            </div>
            
		</div>

		<div class = "datos">
            
			<h2> Datos de los sensores</h2>
                  <!-- COLUMNA DERECHA: PLANO DE LA HABITACIÓN -->
        <section class="control">
			<h3>Plano de la habitación</h3>
			<p class="explicacion">Configuración de los sensores:</p>

			<!-- Contenedor relativo que envuelve la imagen y los sensores -->
			<div class="plano">
				<img src="plano.jpg" alt="Plano de la habitación" class="imagen_plano">

				<div class="sensor temperatura">
					<label>🌡️ Temperatura <input type="checkbox"></label>
				</div>
				<div class="sensor luz">
					<label>💡 Luz <input type="checkbox"></label>
				</div>
				<div class="sensor sonido">
					<label>🔊 Sonido <input type="checkbox"></label>
				</div>
				<div class="sensor movimiento">
					<label>🚶 Movimiento <input type="checkbox"></label>
				</div>
			</div>
		</section>

            <br>
            <label for="tmax">Temperatura máxima: </label>
                <input type="number" id="tmax" name="tmax"
                        min="-20" max="45" step="0.5" >
            <br>
            <label for="tmin">Temperatura mínima: </label>
                <input type="number" id="tmin" name="tmin"
                        min="-20" max="45" step="0.5"  >
            <br>
            <label for="tmin">Temperatura actual: </label>
                <input type="number" id="tempAct" name="tempAct" step="any">
            <br>
            <label for="difTemp">Diferencia de temperatura:</label>
                <output id="difTemp" name="difTemp" for="tmax tmin"></output>
        
		</div>
	</div>
      <div class="contenido_principal">
        <div class="boton">
            <script src="datos.js"></script>
            <button type="submit" class="btn">Enviar</button>
        </div>
      </div>
        
    

    </form>

    <!--Ventana modal-->

    <div class="modal" id="modal">
        <div class="hmodal">
            <h2 id = "error"></h2>
        </div>

        <div class="m-contenido">
            <p id ="mensajeModal"></p>
        </div>

        <div class="m-pie">
            <button type="button" class="m-button" id="cerrar_m">Aceptar</button>
        </div>
    </div>
	  
	  <footer class="footer">
		<a href="index.html">Inicio</a>
		<p>Universidad de Alcalá</p>	 
	  </footer>
      <!--Necesario para el registro, es decir para "minombre.html"-->
		<script>
			var nombre = localStorage.getItem("fname");

			if (nombre) 
			{
				document.getElementById("mensaje").innerHTML =
					"Hola " + nombre + ": Bienvenido/a a Smart Room.";
			}

	  	</script>
	</body>
</html>
