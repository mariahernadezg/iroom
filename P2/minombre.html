		<main>
			<form id="formulario_nombre" class="formulario_nombre">

				<h2>Personalización de la página</h2>

				<!--Campo mi nombre-->
				<div class = "campo">
					<label for="fname">Introduzca su nombre:</label>
            		<input type="text" id="fname" name="fname" required placeholder = "tunombre">

                	Guardar nombre
            		</button>
        		</div>

				<!--Campo correo electrónico-->
				<div class="campo">
					<label for="correo">Introduzca su correo electrónico:</label>
					<input type="email" id="correo" name="correo" placeholder = "usuario@domino.extensión">

					<div class="acciones">
						<button type="button" class="btn" id="btnJs">
							Validar con JavaScript
						</button>

						<button type="button" class="btn" id="btnRegEx">
							Validar con expresiones regulares
						</button>
            		</div>
					<p id="emailError"> </p>
				</div>

			</form>

			<p class="volver">
				<a href="index.html">Volver al inicio</a>
