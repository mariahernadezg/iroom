<!DOCTYPE html>
<html lang="es">
	<head> <meta charset="utf-8">
		<title>Calculadora</title>
		<link rel="stylesheet" type="text/css" href="./css/iroom.css">
        <script src="calculadora.js" defer></script>
    </head>
	<body>

	  <!-- Encabezado -->
	  <header class="header">
		 <h1>Calculadora de temperaturas</h1>
	  </header>
	  
	  <!-- Navegación-->
       <nav class="navegacion">
            <div class="menu">
                <a href="index.html">Inicio</a>
            </div>
            <div class="menu" >
               	<a href="config.html">Configuración</a>
            </div>
            <div class="menu">
               	<a href="minombre.html">Registro</a>
            </div>
			<div class="menu">
               	<a href="calculadora.html">Calculadora</a>
            </div>
            <aside class="menu" >
               	<p id="mensaje">Hola: Bienvenido a Smart Room</p>
            </aside>
        </nav>
        
	  <!-- Contenido principal de esta página-->
	  <main>
		<div class = "calculadora">
            <h2>CALCULADORA</h2>
            <div id="pantalla" class="pantalla"></div>

            <div class="unidades"> 
                <label for="udOrigen">Unidad de origen:</label> 
                <select id="udOrigen"> 
                    <option value="C">Celsius (°C)</option> 
                    <option value="K">Kelvin (K)</option> 
                    <option value="F">Fahrenheit (°F)</option> 
                </select> 
                <label for="udDestino">Convertir a:</label> 
                <select id="udDestino"> 
                    <option value="C">Celsius (°C)</option> 
                    <option value="K">Kelvin (K)</option> 
                    <option value="F">Fahrenheit (°F)</option> 
                </select> 
            </div>

            <div class="botones">
                <button id="AC" type="button" class="btn_calc">AC</button>
                <button id="DEL" type="button" class="btn_calc">DEL</button>
                <button id="conv" type="button" class="btn_calc">Convertir</button>
                <button id="/" type="button" class="btn_calc">÷</button>

                <button id="7" type="button" class="btn_calc">7</button>
                <button id="8" type="button" class="btn_calc">8</button>
                <button id="9" type="button" class="btn_calc">9</button>
                <button id="x" type="button" class="btn_calc">x</button>

                <button id="4" type="button" class="btn_calc">4</button>
                <button id="5" type="button" class="btn_calc">5</button>
                <button id="6" type="button" class="btn_calc">6</button>
                <button id="-" type="button" class="btn_calc">-</button>

                <button id="1" type="button" class="btn_calc">1</button>
                <button id="2" type="button" class="btn_calc">2</button>
                <button id="3" type="button" class="btn_calc">3</button>
                <button id="+" type="button" class="btn_calc">+</button>

                <button id="+/-" type="button" class="btn_calc">+/-</button>
                <button id="0" type="button" class="btn_calc">0</button>
                <button id="." type="button" class="btn_calc">,</button>
                <button id="=" type="button" class="btn_calcs">=</button>
            </div>
        </div>
		
	  </main>

	  <!--Pie de página -->
	  <footer class="footer">
		<p>Universidad de Alcalá</p>
	  </footer>
	<!--Necesario para el registro, es decir para "minombre.html"-->
		<script>
			var nombre = localStorage.getItem("fname");

			if (nombre) 
			{
				document.getElementById("mensaje").innerHTML =
					"Hola " + nombre + ": Bienvenido/a a Smart Room.";
			}

	  	</script>  
	</body>
</html>
